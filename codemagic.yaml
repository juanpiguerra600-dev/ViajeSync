workflows:
  android-apk-build:
    name: Compilación APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Configurar propiedades locales de Android
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Obtener dependencias de Flutter
        script: |
          flutter packages pub get
      - name: Compilar APK de Release para Android
        script: |
          flutter build apk --release --split-per-abi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - juanpiguerra600@gmail.com
        notify:
          on_success: true
          on_failure: true
