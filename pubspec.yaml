name: viaje_sync_plan
description: "Aplicación de Planificación e Itinerario de Viaje con Mapa Interactivo y Rutas"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Mapas y Coordenadas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Red y Enlaces Externos
  http: ^1.2.0
  url_launcher: ^6.2.5

  # Estilos e Iconos
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.1.0

  # Estado y Utilidades
  intl: ^0.20.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
